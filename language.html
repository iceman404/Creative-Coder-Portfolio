<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Language Stats</title>

    <!-- Google Font for styling -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://www.iceman404.com/" />

    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 500px;
            margin-top: 30px;
        }

        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            background-color: #2c3e50;
            color: white;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>GitHub Language Stats</h1>
        <p>Programming Languages Used:</p>
    </header>

    <div class="container">
        <canvas id="languageChart"></canvas>
    </div>

    <footer>
        <p>&copy; 2025 GitHub Language Stats | All rights reserved</p>
    </footer>

    <script>
        async function fetchLanguages() {
            try {
                const response = await fetch("https://api.github.com/users/iceman404/repos");
                if (!response.ok) {
                    throw new Error("Failed to fetch repositories");
                }
                const repos = await response.json();
                const languageCount = {};

                repos.forEach(repo => {
                    if (repo.language) {
                        languageCount[repo.language] = (languageCount[repo.language] || 0) + 1;
                    }
                });

                const ctx = document.getElementById("languageChart").getContext("2d");
                new Chart(ctx, {
                    type: "pie",
                    data: {
                        labels: Object.keys(languageCount),
                        datasets: [{
                            data: Object.values(languageCount),
                            backgroundColor: [
                                "#ff6384", "#36a2eb", "#ffce56", "#4bc0c0", "#9966ff", "#ff9f40"
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: "bottom" }
                        },
                        animation: {
                            animateScale: true,
                            animateRotate: true
                        }
                    }
                });
            } catch (error) {
                console.error(error);
                alert("An error occurred while fetching the data. Please try again later.");
            }
        }

        fetchLanguages();
    </script>
</body>
</html>
