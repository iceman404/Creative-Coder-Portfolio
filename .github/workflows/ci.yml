name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-checks:
    name: Static link & asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links and assets
        run: python3 .github/scripts/check_links.py

      - name: Validate sitemap freshness
        run: |
          # Sitemap must reference the current year's lastmod at least once
          if ! grep -q "$(date +%Y)" sitemap.xml; then
            echo "sitemap.xml lastmod dates look stale"; exit 1
          fi
