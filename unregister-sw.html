<!DOCTYPE html>
<html>
<head>
  <title>Unregister Service Worker</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon/favicon-16x16.png">
  <!-- Protection -->
  <script src="js/protection.js"></script>
</head>
<body>
  <h1>Service Worker Unregistration</h1>
  <button onclick="unregisterSW()">Unregister Service Worker</button>
  <div id="status"></div>
  
  <script>
    async function unregisterSW() {
      const statusDiv = document.getElementById('status');
      
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          
          if (registrations.length === 0) {
            statusDiv.innerHTML = '<p style="color: green;">No service workers registered.</p>';
            return;
          }
          
          for (let registration of registrations) {
            const unregistered = await registration.unregister();
            if (unregistered) {
              statusDiv.innerHTML += '<p style="color: green;">✓ Service worker unregistered successfully!</p>';
            } else {
              statusDiv.innerHTML += '<p style="color: orange;">Service worker unregistration returned false.</p>';
            }
          }
          
          statusDiv.innerHTML += '<p style="color: blue;">Please close all tabs with this site and reopen to clear cache.</p>';
        } catch (error) {
          statusDiv.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
        }
      } else {
        statusDiv.innerHTML = '<p style="color: orange;">Service Workers not supported in this browser.</p>';
      }
    }
    
    // Auto-run on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        unregisterSW();
      }, 500);
    });
  </script>
</body>
</html>
