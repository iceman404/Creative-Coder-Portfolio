  <script>
(function(){
  function currentTheme(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';}
  function paintToggle(){var b=document.getElementById('theme-toggle');if(!b)return;var c=currentTheme();
    b.innerHTML='<i class="fas fa-'+(c==='light'?'moon':'sun')+'" aria-hidden="true"></i>';
    b.setAttribute('aria-label',c==='light'?'Switch to dark theme':'Switch to light theme');}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('theme-toggle');
    if(b){b.addEventListener('click',function(){
      var next=currentTheme()==='light'?'dark':'light';
      document.documentElement.setAttribute('data-theme',next);
      try{localStorage.setItem('iceman404-theme',next);}catch(e){}
      document.dispatchEvent(new CustomEvent('themechange',{detail:{theme:next}}));
      paintToggle();});}
    paintToggle();});
})();
</script>
