<script>
const texts = [
  { text: `Hi! I'm John, a lifelong learner and tech enthusiast who's main goal is to get deep into AI and technology!
My passion for AI is so strong that I’ve tried to teach my quadcopter how to fly by sending more voltages as a form of punishment reward.
I'm basically a lifelong learner, mostly because I keep forgetting what I learned last week. 😁`, id:"typingEffect1" },
  { text: `I've logged 15,000 hours in Dota 2, most of which were spent farming and wondering who pressed the glyph and why my teammates can't read a map. 😁`, id:"typingEffect2" },
  { text: `Oh, you know, I can recite the longest place name in the world: Taumatawhakatangihangakoauauotamateaturipukakapikimaungahoronukupokaiwhenuakitanatahu
with my eyes closed.
I can also solve a 3x3 Rubik's cube in under 2 minutes, both by color and spatial orientation too just using my bare hands 😉.
And I have a thing for high IQs too.
I once tried to impress someone by solving a Rubik’s Cube in under two minutes. They were impressed and I was relieved that I didn't mess it up. 😁`, id:"typingEffect3" },
  { text: `In my spare time, I build custom neural networks for UAVs, for real-world applications.`, id:"typingEffect4" },
  { text: `As my favorite philosopher once said: "If you can't dazzle them with brilliance, baffle them with nonsense" 😁`, id:"typingEffect5" }
];

const delay = 35;

async function typeText({text, id}) {
  const el = document.getElementById(id);
  let i = 0;
  return new Promise(resolve => {
    function step() {
      if (i < text.length) {
        el.innerHTML += text[i] === "\n" ? "<br>" : text[i];
        i++;
        setTimeout(step, delay);
      } else resolve();
    }
    step();
  });
}

(async function runAll() {
  for (let t of texts) await typeText(t);
})();

// Optional: Scroll effect for 3D tilt
window.addEventListener('scroll', () => {
  document.querySelectorAll('.bio-section').forEach(sec => {
    const rect = sec.getBoundingClientRect();
    const rotateX = ((rect.top/window.innerHeight)-0.5)*10;
    const rotateY = ((rect.left/window.innerWidth)-0.5)*10;
    sec.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  });
});
</script>
